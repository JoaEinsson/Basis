[package]
name = "basis"
version = "0.3.0"
description = "A local-first, data-driven music player"
authors = ["JoaEinsson"]
license = "Apache-2.0"
repository = "https://github.com/JoaEinsson/Basis"
edition = "2021"
rust-version = "1.77"

[lib]
name = "basis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
blake3 = "1.8"
ignore = "0.4"
image = { version = "0.24.9", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
lofty = "0.25"
notify = "8"
palette = { version = "0.7", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.40", features = ["bundled", "modern_sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "2.0.0-rc.25", features = ["derive", "uuid"] }
specta-typescript = "0.0.12"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "=2.10.0"
tauri-specta = { version = "2.0.0-rc.25", features = ["derive", "typescript"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
tempfile = "3.27"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
voxio = "=0.2.3"

[dev-dependencies]
jsonschema = { version = "0.18", default-features = false }
minisign-verify = "0.2"
