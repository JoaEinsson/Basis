<svg xmlns="http://www.w3.org/2000/svg"
     width="1254" height="1254" viewBox="0 0 1254 1254"
     role="img" aria-labelledby="title desc">
  <title id="title">Basis — Signal icon</title>
  <desc id="desc">Basis B monogram formed from flowing audio-wave ribbons.</desc>

  <defs>
    <!-- Brand palette intentionally independent from user theme accents. -->
    <radialGradient id="basis-bg" cx="50%" cy="12%" r="86%">
      <stop offset="0" stop-color="#20262B"/>
      <stop offset=".58" stop-color="#11161A"/>
      <stop offset="1" stop-color="#080B0D"/>
    </radialGradient>

    <!-- Signal Cyan: audio/signal/instrumentation identity without tying Basis to one UI theme. -->
    <linearGradient id="basis-signal"
                    x1="401" y1="0" x2="877" y2="0"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2FFFC"/>
      <stop offset=".32" stop-color="#A5F4E6"/>
      <stop offset=".68" stop-color="#49D9C7"/>
      <stop offset="1" stop-color="#20AFC8"/>
    </linearGradient>

    <linearGradient id="basis-rim"
                    x1="90" y1="80" x2="1160" y2="1170"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5DE1D0" stop-opacity=".45"/>
      <stop offset=".45" stop-color="#2BB7C8" stop-opacity=".15"/>
      <stop offset="1" stop-color="#19768A" stop-opacity=".28"/>
    </linearGradient>

    <filter id="basis-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="13"
                    flood-color="#000000" flood-opacity=".34"/>
    </filter>
  </defs>

  <rect x="76" y="73" width="1102" height="1097" rx="226"
        fill="url(#basis-bg)"/>
  <rect x="80" y="76" width="1094" height="1090" rx="222"
        fill="none" stroke="url(#basis-rim)" stroke-width="5"/>

