name: Release Basis

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          libasound2-dev
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run release:validate
      - run: pnpm run release:test
      - run: pnpm audit --prod
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run format:check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets
      - run: cargo install cargo-audit --locked
      - run: cargo audit --file src-tauri/Cargo.lock

  publish:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --bundles nsis
          - platform: ubuntu-22.04
            args: --bundles appimage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          libasound2-dev
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Basis v__VERSION__
          releaseBody: |
            Basis stable release.

            Update artifacts are cryptographically signed for the Tauri updater.
            The Windows installer is not Authenticode-signed yet and may show a Microsoft SmartScreen warning.
          # Keep the release recoverable until the cross-platform manifest has
          # been checked. The final job is the only place that publishes it.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
      - name: Finalize stable Linux updater asset
        id: linux_appimage
        if: matrix.platform == 'ubuntu-22.04'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          bash scripts/repack-appimage.sh
          appimage=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          test -n "$appimage"
          original_name=$(basename "$appimage")
          stable_appimage=$(dirname "$appimage")/Basis.AppImage
          rm -f -- "$appimage.sig" "$stable_appimage.sig"
          if [[ "$appimage" != "$stable_appimage" ]]; then
            mv -- "$appimage" "$stable_appimage"
          fi
          chmod +x "$stable_appimage"
          pnpm tauri signer sign "$stable_appimage"
          test -s "$stable_appimage.sig"
          echo "original_name=$original_name" >> "$GITHUB_OUTPUT"
      - name: Validate Linux AppImage payload and icon
        if: matrix.platform == 'ubuntu-22.04'
        run: bash scripts/validate-appimage.sh
      - name: Replace draft AppImage with the validated artifact
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORIGINAL_NAME: ${{ steps.linux_appimage.outputs.original_name }}
        run: |
          set -euo pipefail
          appimage=src-tauri/target/release/bundle/appimage/Basis.AppImage
          test -s "$appimage"
          test -s "$appimage.sig"
          if [[ "$ORIGINAL_NAME" != "Basis.AppImage" ]]; then
            gh release delete-asset "$GITHUB_REF_NAME" "$ORIGINAL_NAME" --yes || true
            gh release delete-asset "$GITHUB_REF_NAME" "$ORIGINAL_NAME.sig" --yes || true
          fi
          gh release upload "$GITHUB_REF_NAME" "$appimage" "$appimage.sig" --clobber

  validate-release-metadata:
    needs: publish
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install pinned updater-signature verifier
        run: |
          bash scripts/install-minisign.sh "$RUNNER_TEMP/basis-tools"
          echo "$RUNNER_TEMP/basis-tools" >> "$GITHUB_PATH"
      - name: Download final updater artifacts and signatures
        run: |
          mkdir release-assets
          gh release download "$GITHUB_REF_NAME" \
            --pattern '*.AppImage' \
            --pattern '*.AppImage.sig' \
            --pattern '*-setup.exe' \
            --pattern '*-setup.exe.sig' \
            --dir release-assets
      - name: Verify artifacts against the embedded updater key
        run: bash scripts/verify-updater-signatures.sh release-assets
      - name: Generate metadata from the verified final artifacts
        run: >-
          node scripts/finalize-updater-manifest.mjs
          release-assets "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" latest.json
      - name: Validate both signed updater targets
        run: node scripts/validate-updater-manifest.mjs latest.json "$GITHUB_REF_NAME"
      - name: Replace generated updater metadata
        run: gh release upload "$GITHUB_REF_NAME" latest.json --clobber
      - name: Publish the validated stable release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=false
